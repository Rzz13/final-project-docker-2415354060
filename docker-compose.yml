services:
  backend:
    container_name: final-docker-app
    build: ./app
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - /app/.env
    networks:
      - final-docker

  mysql:
    image: mysql:8
    container_name: final-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: praktikum_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - final-docker

      
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: final-phpmyadmin
    environment:
      PMA_HOST: mysql
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - final-docker

volumes:
  mysql_data:

networks:
  final-docker:
    driver: bridge
